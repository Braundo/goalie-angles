<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <title>Goalie - Standup Stance (Front View)</title>

  <!-- Background -->
  <rect width="400" height="600" fill="#87CEEB"/>

  <!-- Goal Frame -->
  <rect x="50" y="50" width="300" height="200" fill="none" stroke="#FF0000" stroke-width="4"/>

  <!-- Goal Net Pattern -->
  <g stroke="#CCCCCC" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="250"/>
    <line x1="150" y1="50" x2="150" y2="250"/>
    <line x1="200" y1="50" x2="200" y2="250"/>
    <line x1="250" y1="50" x2="250" y2="250"/>
    <line x1="300" y1="50" x2="300" y2="250"/>
    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="50" y1="150" x2="350" y2="150"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
  </g>

  <!-- Goalie centered in front of goal -->
  <g transform="translate(200, 550)">
    <!-- Leg Pads (white) -->
    <rect x="-70" y="-270" width="60" height="270" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    <rect x="10" y="-270" width="60" height="270" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Pants (light grey) -->
    <rect x="-50" y="-390" width="100" height="150" fill="#BBBBBB" stroke="#999999" stroke-width="2"/>

    <!-- Chest Protector/Jersey (white) -->
    <rect x="-60" y="-528" width="120" height="180" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Shoulders (white) -->
    <rect x="-84" y="-552" width="40" height="90" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    <rect x="44" y="-552" width="40" height="90" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Glove (left side, raised) - white -->
    <circle cx="-90" cy="-450" r="24" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>

    <!-- Blocker (right side, lower) - white -->
    <rect x="50" y="-408" width="44" height="120" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>

    <!-- Stick -->
    <line x1="70" y="-300" x2="84" y="0" stroke="#8B4513" stroke-width="5"/>
    <!-- Stick Blade -->
    <rect x="76" y="-30" width="30" height="30" fill="#000000"/>

    <!-- Helmet (white) -->
    <circle cx="0" cy="-552" r="36" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>

    <!-- Mask Cage (dark grey) -->
    <g stroke="#666666" stroke-width="1.5">
      <line x1="-20" y1="-588" x2="-20" y2="-516"/>
      <line x1="-10" y1="-588" x2="-10" y2="-516"/>
      <line x1="0" y1="-588" x2="0" y2="-516"/>
      <line x1="10" y1="-588" x2="10" y2="-516"/>
      <line x1="20" y1="-588" x2="20" y2="-516"/>
    </g>
  </g>

  <!-- Label -->
  <text x="200" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#000000">Standup Stance - Front View</text>
</svg>
