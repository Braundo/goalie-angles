<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <title>Hockey Goalie - Standup Stance</title>

  <!-- Background -->
  <rect width="400" height="500" fill="#87CEEB" opacity="0"/>

  <!-- Goalie centered at bottom -->
  <g transform="translate(200, 450)">

    <!-- Left Leg Pad -->
    <g id="leftPad">
      <!-- Main pad body -->
      <rect x="-85" y="-280" width="45" height="250" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
      <!-- Knee stack -->
      <rect x="-85" y="-180" width="45" height="60" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
      <!-- Pad segments -->
      <line x1="-85" y1="-240" x2="-40" y2="-240" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-85" y1="-200" x2="-40" y2="-200" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-85" y1="-160" x2="-40" y2="-160" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-85" y1="-120" x2="-40" y2="-120" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-85" y1="-80" x2="-40" y2="-80" stroke="#DDDDDD" stroke-width="1"/>
      <!-- Skate boot -->
      <ellipse cx="-62.5" cy="-15" rx="24" ry="18" fill="#333333" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Right Leg Pad -->
    <g id="rightPad">
      <!-- Main pad body -->
      <rect x="40" y="-280" width="45" height="250" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
      <!-- Knee stack -->
      <rect x="40" y="-180" width="45" height="60" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
      <!-- Pad segments -->
      <line x1="40" y1="-240" x2="85" y2="-240" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="40" y1="-200" x2="85" y2="-200" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="40" y1="-160" x2="85" y2="-160" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="40" y1="-120" x2="85" y2="-120" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="40" y1="-80" x2="85" y2="-80" stroke="#DDDDDD" stroke-width="1"/>
      <!-- Skate boot -->
      <ellipse cx="62.5" cy="-15" rx="24" ry="18" fill="#333333" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Pants -->
    <rect x="-50" y="-320" width="100" height="70" rx="5" fill="#BBBBBB" stroke="#999999" stroke-width="2"/>

    <!-- Chest Protector / Jersey -->
    <path d="M -60,-320 L -60,-380 Q -60,-400 -50,-405 L -40,-410 L -40,-420 L 40,-420 L 40,-410 L 50,-405 Q 60,-400 60,-380 L 60,-320 Z"
          fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Shoulders -->
    <ellipse cx="-55" cy="-405" rx="30" ry="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    <ellipse cx="55" cy="-405" rx="30" ry="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Left Arm -->
    <rect x="-75" y="-395" width="20" height="80" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>

    <!-- Catching Glove (left) -->
    <g id="glove">
      <ellipse cx="-85" cy="-280" rx="35" ry="28" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>
      <!-- Glove webbing detail -->
      <path d="M -105,-280 Q -85,-265 -65,-280" fill="none" stroke="#999999" stroke-width="2"/>
      <circle cx="-85" cy="-280" r="8" fill="#EEEEEE" stroke="#999999" stroke-width="1"/>
    </g>

    <!-- Right Arm -->
    <rect x="55" y="-395" width="20" height="80" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>

    <!-- Blocker (right) -->
    <g id="blocker">
      <rect x="60" y="-330" width="50" height="45" rx="5" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>
      <!-- Blocker details -->
      <rect x="65" y="-325" width="40" height="35" rx="3" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
      <line x1="85" y1="-325" x2="85" y2="-290" stroke="#CCCCCC" stroke-width="1"/>
    </g>

    <!-- Stick -->
    <g id="stick">
      <!-- Shaft -->
      <line x1="85" y1="-300" x2="95" y2="0" stroke="#8B4513" stroke-width="4"/>
      <!-- Blade -->
      <rect x="88" y="-8" width="25" height="8" rx="2" fill="#000000" stroke="#222222" stroke-width="1"/>
    </g>

    <!-- Helmet -->
    <g id="helmet">
      <!-- Main helmet shell -->
      <ellipse cx="0" cy="-425" rx="40" ry="45" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>
      <!-- Mask cage -->
      <g stroke="#666666" stroke-width="1.5" fill="none">
        <line x1="-25" y1="-445" x2="-25" y2="-405"/>
        <line x1="-15" y1="-445" x2="-15" y2="-405"/>
        <line x1="-5" y1="-445" x2="-5" y2="-405"/>
        <line x1="5" y1="-445" x2="5" y2="-405"/>
        <line x1="15" y1="-445" x2="15" y2="-405"/>
        <line x1="25" y1="-445" x2="25" y2="-405"/>
        <!-- Horizontal bars -->
        <line x1="-25" y1="-435" x2="25" y2="-435"/>
        <line x1="-25" y1="-425" x2="25" y2="-425"/>
        <line x1="-25" y1="-415" x2="25" y2="-415"/>
      </g>
      <!-- Chin cup -->
      <path d="M -15,-405 Q 0,-400 15,-405" fill="none" stroke="#999999" stroke-width="2"/>
    </g>

  </g>

  <!-- Label -->
  <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3c72">Standup Stance</text>

</svg>
