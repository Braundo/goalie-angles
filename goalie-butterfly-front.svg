<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>Hockey Goalie - Butterfly Stance</title>

  <!-- Background -->
  <rect width="600" height="400" fill="#87CEEB" opacity="0"/>

  <!-- Goalie centered at bottom -->
  <g transform="translate(300, 350)">

    <!-- Left Leg Pad (rotated/flattened for butterfly) -->
    <g id="leftPad">
      <!-- Main pad body (horizontal) -->
      <rect x="-270" y="-80" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
      <!-- Knee stack area -->
      <rect x="-120" y="-80" width="70" height="50" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
      <!-- Pad segments (horizontal lines) -->
      <line x1="-270" y1="-70" x2="-50" y2="-70" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-270" y1="-60" x2="-50" y2="-60" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-270" y1="-50" x2="-50" y2="-50" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-270" y1="-40" x2="-50" y2="-40" stroke="#DDDDDD" stroke-width="1"/>
      <!-- Vertical segments -->
      <line x1="-230" y1="-80" x2="-230" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-190" y1="-80" x2="-190" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-150" y1="-80" x2="-150" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="-90" y1="-80" x2="-90" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <!-- Pad straps -->
      <line x1="-260" y1="-65" x2="-60" y2="-65" stroke="#666666" stroke-width="2.5"/>
      <line x1="-260" y1="-45" x2="-60" y2="-45" stroke="#666666" stroke-width="2.5"/>
      <!-- Skate boot -->
      <ellipse cx="-250" cy="-20" rx="22" ry="18" fill="#333333" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Right Leg Pad (rotated/flattened for butterfly) -->
    <g id="rightPad">
      <!-- Main pad body (horizontal) -->
      <rect x="50" y="-80" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
      <!-- Knee stack area -->
      <rect x="50" y="-80" width="70" height="50" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
      <!-- Pad segments (horizontal lines) -->
      <line x1="50" y1="-70" x2="270" y2="-70" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="50" y1="-60" x2="270" y2="-60" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="50" y1="-50" x2="270" y2="-50" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="50" y1="-40" x2="270" y2="-40" stroke="#DDDDDD" stroke-width="1"/>
      <!-- Vertical segments -->
      <line x1="90" y1="-80" x2="90" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="150" y1="-80" x2="150" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="190" y1="-80" x2="190" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <line x1="230" y1="-80" x2="230" y2="-30" stroke="#DDDDDD" stroke-width="1"/>
      <!-- Pad straps -->
      <line x1="60" y1="-65" x2="260" y2="-65" stroke="#666666" stroke-width="2.5"/>
      <line x1="60" y1="-45" x2="260" y2="-45" stroke="#666666" stroke-width="2.5"/>
      <!-- Skate boot -->
      <ellipse cx="250" cy="-20" rx="22" ry="18" fill="#333333" stroke="#000000" stroke-width="2"/>
    </g>

    <!-- Pants (lower position in butterfly) -->
    <rect x="-45" y="-120" width="90" height="50" rx="5" fill="#BBBBBB" stroke="#999999" stroke-width="2"/>

    <!-- Chest Protector / Jersey (compressed lower) -->
    <rect x="-50" y="-200" width="100" height="90" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    <line x1="-50" y1="-155" x2="50" y2="-155" stroke="#DDDDDD" stroke-width="1"/>

    <!-- Left Shoulder -->
    <ellipse cx="-45" cy="-200" rx="28" ry="22" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Left Arm Extended -->
    <rect x="-200" y="-185" width="155" height="28" rx="10" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>

    <!-- Catching Glove (left, extended) -->
    <g id="glove">
      <ellipse cx="-230" cy="-170" rx="42" ry="32" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>
      <!-- Glove webbing detail -->
      <path d="M -255,-170 Q -230,-150 -205,-170" fill="none" stroke="#999999" stroke-width="2"/>
      <circle cx="-230" cy="-170" r="10" fill="#EEEEEE" stroke="#999999" stroke-width="1"/>
      <!-- Glove finger details -->
      <line x1="-245" y1="-175" x2="-245" y2="-155" stroke="#CCCCCC" stroke-width="1"/>
      <line x1="-230" y1="-178" x2="-230" y2="-158" stroke="#CCCCCC" stroke-width="1"/>
      <line x1="-215" y1="-175" x2="-215" y2="-155" stroke="#CCCCCC" stroke-width="1"/>
    </g>

    <!-- Right Shoulder -->
    <ellipse cx="45" cy="-200" rx="28" ry="22" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- Right Arm Extended -->
    <rect x="45" y="-185" width="155" height="28" rx="10" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>

    <!-- Blocker (right, extended) -->
    <g id="blocker">
      <rect x="190" y="-195" width="62" height="52" rx="5" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>
      <!-- Blocker details -->
      <rect x="195" y="-190" width="52" height="42" rx="3" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
      <line x1="221" y1="-190" x2="221" y2="-148" stroke="#CCCCCC" stroke-width="1"/>
      <line x1="195" y1="-169" x2="247" y2="-169" stroke="#CCCCCC" stroke-width="1"/>
    </g>

    <!-- Stick (horizontal across pads) -->
    <g id="stick">
      <!-- Shaft -->
      <line x1="-150" y1="-35" x2="240" y2="-35" stroke="#8B4513" stroke-width="5"/>
      <!-- Blade -->
      <rect x="232" y="-48" width="30" height="13" rx="2" fill="#000000" stroke="#222222" stroke-width="1"/>
    </g>

    <!-- Helmet (lower position in butterfly) -->
    <g id="helmet">
      <!-- Main helmet shell -->
      <ellipse cx="0" cy="-230" rx="42" ry="48" fill="#FFFFFF" stroke="#999999" stroke-width="3"/>
      <!-- Mask cage -->
      <g stroke="#666666" stroke-width="1.5" fill="none">
        <line x1="-28" y1="-252" x2="-28" y2="-208"/>
        <line x1="-18" y1="-252" x2="-18" y2="-208"/>
        <line x1="-8" y1="-252" x2="-8" y2="-208"/>
        <line x1="2" y1="-252" x2="2" y2="-208"/>
        <line x1="12" y1="-252" x2="12" y2="-208"/>
        <line x1="22" y1="-252" x2="22" y2="-208"/>
        <line x1="28" y1="-252" x2="28" y2="-208"/>
        <!-- Horizontal bars -->
        <line x1="-28" y1="-245" x2="28" y2="-245"/>
        <line x1="-28" y1="-235" x2="28" y2="-235"/>
        <line x1="-28" y1="-225" x2="28" y2="-225"/>
        <line x1="-28" y1="-215" x2="28" y2="-215"/>
      </g>
      <!-- Chin cup -->
      <path d="M -18,-208 Q 0,-202 18,-208" fill="none" stroke="#999999" stroke-width="2"/>
    </g>

  </g>

  <!-- Label -->
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3c72">Butterfly Stance</text>

</svg>
